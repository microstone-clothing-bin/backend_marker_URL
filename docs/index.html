<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>의류 수거함 클러스터링</title>

    <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=44c7lycb4w&callback=initMap"></script>

    <script src="./js/markerclustering.js" defer></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .cluster {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    // 전역 변수로 선언하여 여러 함수에서 접근 가능하도록 함
    let map;
    let markers = [];
    let clusterer = null;
    let selectedInfoWindow = null;

    // 네이버 지도 API가 준비되면 호출될 메인 함수
    function initMap() {
        map = new naver.maps.Map("map", {
            center: new naver.maps.LatLng(37.6, 127.1),
            zoom: 13,
            scaleControl: false,
            logoControl: false,
            mapDataControl: false,
            mapTypeControl: false,
            zoomControl: true,
            zoomControlOptions: {
                position: naver.maps.Position.TOP_LEFT,
                style: naver.maps.ZoomControlStyle.SMALL
            }
        });

        // 지도 움직임이 멈췄을 때 마커를 업데이트
        naver.maps.Event.addListener(map, 'idle', updateMarkers);

        // 지도 빈 공간 클릭 시 정보창 닫기
        naver.maps.Event.addListener(map, 'click', () => {
            if (selectedInfoWindow) {
                selectedInfoWindow.close();
                selectedInfoWindow = null;
            }
        });

        // 지도가 처음 로딩되었을 때 마커를 한번 불러옴
        updateMarkers();
    }

    // 마커 클러스터 객체를 생성하는 함수
    function makeClusterer() {
        return new MarkerClustering({
            minClusterSize: 2,
            maxZoom: 16,
            map: map,
            markers: markers,
            disableClickZoom: false,
            gridSize: 120,
            icons: [{
                content: `<div class="cluster"></div>`,
                size: new naver.maps.Size(40, 40),
                anchor: new naver.maps.Point(20, 20)
            }],
            indexGenerator: [10, 100, 200, 500, 1000],
            stylingFunction: function (clusterMarker, count) {
                const clusterDiv = clusterMarker.getElement().querySelector('div');
                const size = Math.min(60, 20 + Math.sqrt(count) * 2);
                const fontSize = Math.max(12, size / 3.5);

                clusterDiv.textContent = count;
                clusterDiv.style.width = `${size}px`;
                clusterDiv.style.height = `${size}px`;
                clusterDiv.style.lineHeight = `${size}px`;
                clusterDiv.style.fontSize = `${fontSize}px`;

                if (count < 10) { clusterDiv.style.backgroundColor = '#ffd5e1'; }
                else if (count < 20) { clusterDiv.style.backgroundColor = '#ffacc3'; }
                else if (count < 30) { clusterDiv.style.backgroundColor = '#ff88bc'; }
                else if (count < 40) { clusterDiv.style.backgroundColor = '#fd6b88'; }
                else if (count < 50) { clusterDiv.style.backgroundColor = '#c637ff'; }
                else if (count < 60) { clusterDiv.style.backgroundColor = '#7b00ff'; }
                else if (count < 100) { clusterDiv.style.backgroundColor = '#000bff'; }
                else if (count < 200) { clusterDiv.style.backgroundColor = '#594dff'; }
                else if (count < 300) { clusterDiv.style.backgroundColor = '#739bff'; }
                else if (count < 400) { clusterDiv.style.backgroundColor = '#b2c8ff'; }
                else if (count < 500) { clusterDiv.style.backgroundColor = '#ade4ff'; }
                else { clusterDiv.style.backgroundColor = '#d8edff'; }
            }
        });
    }

    // 보이는 지도 영역의 마커들만 서버에서 불러오는 핵심 함수
    function updateMarkers() {
        const bounds = map.getBounds();
        const sw = bounds.getSW();
        const ne = bounds.getNE();

        // API 주소 변경해야함
        const apiUrl = `https://microstone-clothing-bin.github.io/backend_marker_URL/.elasticbeanstalk.com/api/clothing-bins/in-bounds?swLat=${sw.lat()}&swLng=${sw.lng()}&neLat=${ne.lng()}`;

        fetch(apiUrl)
            .then(res => res.ok ? res.json() : Promise.reject('서버 응답 오류'))
            .then(data => {
                // 기존 마커들을 지도에서 제거
                markers.forEach(m => m.setMap(null));
                markers = [];

                // 새로 받은 데이터로 마커 생성
                markers = data.map(bin => {
                    const marker = new naver.maps.Marker({
                        position: new naver.maps.LatLng(bin.latitude, bin.longitude)
                    });

                    const infoWindow = new naver.maps.InfoWindow({
                        content: `<div style="padding:5px;font-size:12px;"><strong>${bin.roadAddress || bin.landLotAddress || '주소 정보 없음'}</strong></div>`,
                        borderWidth: 1
                    });

                    naver.maps.Event.addListener(marker, 'click', () => {
                        if (selectedInfoWindow) selectedInfoWindow.close();
                        infoWindow.open(map, marker);
                        selectedInfoWindow = infoWindow;
                    });
                    return marker;
                });

                // 클러스터러가 없으면 새로 만들고, 있으면 기존 마커를 지우고 새로 추가
                if (clusterer) {
                    clusterer.clearMarkers();
                    clusterer.addMarkers(markers);
                } else {
                    clusterer = makeClusterer();
                }
            })
            .catch(err => console.error('마커 로딩 중 오류 발생:', err));
    }
</script>
</body>
</html>
